# Orange settings. Change values here instead of editing code.
# Secrets (API key) do NOT go here - they go in .env.

assistant:
  name: "Orange"               # What Orange calls itself

wake:
  model: "hey_jarvis"          # Built-in openWakeWord model (a custom "hey orange" can come later)
  threshold: 0.5               # 0-1. Higher = fewer false triggers, but you may need to speak clearer

audio:
  sample_rate: 16000           # 16 kHz: what both openWakeWord and Whisper expect
  channels: 1                  # Mono. One mic channel is all speech recognition needs
  input_device: null           # null = system default mic. Or a device number/name
  max_record_seconds: 8        # Hard stop so a recording can't run forever
  silence_seconds: 1.5         # Stop recording after this much quiet (you finished talking)

stt:
  model_size: "base.en"        # Whisper size: tiny.en (fastest) / base.en / small.en (most accurate)
  device: "cpu"                # "cpu" works everywhere, including the Pi
  compute_type: "int8"         # int8 = smaller and faster on CPU, tiny accuracy loss

vision:
  enabled: true                # Set false to turn the camera feature off completely
  camera_index: 0              # 0 = first webcam. Try 1 if you have a second camera

brain:
  # PLACEHOLDERS - wired up in Phase 5 (via LiteLLM). Model names get checked then.
  # Providers you can pick: "gemini", "groq", "ollama", "claude"
  # Keys for gemini/groq/claude go in .env. Ollama runs locally and needs no key.

  chat:                        # Answers normal questions (text only)
    provider: "gemini"         # Free tier, so no cost for a student
    model: "gemini-2.5-flash"  # Fast, free-tier Gemini model

  vision:                      # Answers questions about camera photos
    provider: "ollama"         # Runs ON your laptop, so photos never leave it
    model: "moondream"         # Small vision model; light enough for the Pi later

  ollama_url: "http://localhost:11434"  # Where the local Ollama app listens
  max_tokens: 300              # Cap reply length. Short answers suit spoken replies

speak:
  engine: "pyttsx3"            # Text-to-speech engine ("piper" later)
  rate: 175                    # Speaking speed (words per minute)
  volume: 1.0                  # 0.0 to 1.0

privacy:
  show_status: true            # Print a line whenever the mic or camera is on
