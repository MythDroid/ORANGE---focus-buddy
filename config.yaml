# Orange settings. Change values here instead of editing code.
# Secrets (API key) do NOT go here - they go in .env.

assistant:
  name: "Orange"               # What Orange calls itself

user:
  name: "Mythrayee"            # Your name. Also helps speech-to-text spell it right

pet:
  width: 180                   # Orange's size in pixels. Smaller number = smaller Orange (was 220)

watch:
  enabled: true                # true = during a study session Orange notices distracting windows
  hide_windows: true           # true = after the nudge she minimises the window (never closes it)
  check_seconds: 1             # How often she glances at which window is in front
  settle_seconds: 2            # A window must stay in front this long before she judges it
  nudge_after_seconds: 20      # Only used if hiding is off, or if this is smaller than hide_after_seconds
  hide_after_seconds: 0       # Seconds between spotting a distraction and hiding it. 0 = at once
  repeat_hide_after_seconds: 0   # Same, for a window you reopened after she hid it
  grow_seconds: 5              # When she hides a window she fills the whole screen this long. 0 = never
  # The ONLY programs she judges. Anything not listed here is never hidden
  # (Calculator, Snipping Tool, Settings, the Wi-Fi panel, your code editor, PDF reader...).
  only_judge: ["chrome.exe", "msedge.exe", "firefox.exe", "brave.exe", "opera.exe",
               "whatsapp.exe", "whatsapp.root.exe", "discord.exe", "telegram.exe",
               "spotify.exe", "netflix.exe", "steam.exe", "instagram.exe"]
  always_fine: []              # Programs from the list above that you want left alone anyway

voice:
  enabled: true                # true = you can TALK to Orange. false = typing only (starts faster)
  hey_orange: true             # true = saying "Hey Orange" wakes her (the mic stays on while she runs)
  shortcut: true               # true = Ctrl+Space makes her listen, from any app

# OLD, NOT USED BY ORANGE ANY MORE ("Hey Jarvis"). Only the old main.py still reads this block.
wake:
  # TEMPORARY placeholder. Real wake word = "Hey Orange" (trained in Phase 5.5),
  # then this becomes "models/hey_orange.onnx". Built-in name OR path to a model file.
  model: "hey_jarvis"
  threshold: 0.5               # 0-1. Higher = fewer false triggers, but you may need to speak clearer
  chunk_samples: 1280          # openWakeWord wants 80 ms chunks: 16000 samples/s x 0.08 s = 1280
  inference_framework: "onnx"  # "onnx" works on Windows AND the Pi ("tflite" is Linux-only)
  show_scores: false           # true = print live scores while you talk (helps tune the threshold)

audio:
  sample_rate: 16000           # 16 kHz: what both openWakeWord and Whisper expect
  channels: 1                  # Mono. One mic channel is all speech recognition needs
  input_device: null           # null = system default mic. Or a device number/name
  block_ms: 30                 # Mic audio is checked in small chunks of this many milliseconds
  silence_threshold: 0.015     # Volume (RMS) below this counts as silence. Run calibrate.py to tune it
  silence_seconds: 1.5         # Stop recording after this much quiet (you finished talking)
  no_speech_timeout: 5         # Give up if you don't start talking within this many seconds
  max_record_seconds: 15       # Hard stop so a recording can't run forever
  pre_roll_seconds: 0.3        # Keep this much audio from just BEFORE you spoke, so the first word isn't cut

stt:
  model_size: "base.en"        # Whisper size: tiny.en (fastest) / base.en / small.en (most accurate)
  # Words Whisper should expect (topics, exam names, jargon). Your name and
  # Orange's name are added in front automatically from user.name / assistant.name.
  hint: "GATE DA. eigenvalues, eigenvectors, matrix, probability."
  use_hotwords: true           # Also push the two names as "hotwords" (extra nudge for names)
  device: "cpu"                # "cpu" works everywhere, including the Pi
  compute_type: "int8"         # int8 = smaller and faster on CPU, tiny accuracy loss

vision:
  enabled: true                # Set false to turn the camera feature off completely
  camera_index: 0              # 0 = first webcam. Try 1 if you have a second camera

brain:
  # Orange's small LOCAL brain. It only helps her understand sentences her rules don't know.
  # Runs through Ollama on this laptop, so nothing you type leaves it.
  understand:
    enabled: true                # false = rules and taught phrases only
    model: "qwen3.5:2b"          # Any model you have pulled with: ollama pull <name>
    url: "http://localhost:11434"   # Where the Ollama app listens (this laptop)
    timeout_seconds: 25          # Give up if the brain takes longer than this
    context: 2048                # Model's working space. Smaller = less graphics-card memory = faster
    show_timing: true            # Print where the brain's time goes (for tuning). false = quiet

  # PLACEHOLDERS - wired up in Phase 5 (via LiteLLM). Model names get checked then.
  # Providers you can pick: "gemini", "groq", "ollama", "claude"
  # Keys for gemini/groq/claude go in .env. Ollama runs locally and needs no key.

  chat:                        # Answers normal questions (text only)
    provider: "gemini"         # Free tier, so no cost for a student
    model: "gemini-2.5-flash"  # Fast, free-tier Gemini model

  vision:                      # Answers questions about camera photos
    provider: "ollama"         # Runs ON your laptop, so photos never leave it
    model: "moondream"         # Small vision model; light enough for the Pi later

  ollama_url: "http://localhost:11434"  # Where the local Ollama app listens
  max_tokens: 300              # Cap reply length. Short answers suit spoken replies

speak:
  engine: "pyttsx3"            # Text-to-speech engine ("piper" later)
  rate: 175                    # Speaking speed (words per minute)
  volume: 1.0                  # 0.0 to 1.0

privacy:
  show_status: true            # Print a line whenever the mic or camera is on
